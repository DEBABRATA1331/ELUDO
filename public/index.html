<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>LUDO 6IX</title>
  <!-- Comic & Funky Fonts: Luckiest Guy, Bangers, Fredoka, Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;700;800&family=Luckiest+Guy&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <!-- Socket.io Client -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- SINGLE-LINE COMPACT TOP NAVIGATION HEADER -->
  <header class="app-header">
    <div class="header-left">
      <!-- Connection Status -->
      <div id="connectionStatus" class="status-indicator online">
        <span class="status-dot"></span>
        <span class="status-text">Connected</span>
      </div>
    </div>

    <div class="header-actions">
      <!-- Cancel Match / Home Button -->
      <button id="cancelMatchBtn" class="btn btn-danger btn-icon shadow-btn" title="Cancel Match & Return Home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>

      <!-- Webhook Config Button -->
      <button id="openWebhookBtn" class="btn btn-secondary btn-icon shadow-btn" title="Configure Webhook Events">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor"/>
        </svg>
      </button>

      <!-- Audio Mute Button -->
      <button id="toggleAudioBtn" class="btn btn-icon" title="Toggle Sound FX">
        <svg id="audioIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
      </button>

      <!-- Share Room Code Badge & Copy Link -->
      <div id="roomCodeDisplayContainer" class="room-code-badge hidden">
        <span>ROOM: <strong id="roomCodeText">------</strong></span>
        <button id="copyInviteLinkBtn" class="btn btn-sm btn-accent" title="Copy Invite Link">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN GAME APP CONTAINER -->
  <main class="game-container">

    <!-- LEFT COLUMN: LUDO BOARD & DICE CONTROL -->
    <section class="board-column">
      
      <!-- REALISTIC PHYSICAL LUDO BOARD WRAPPER -->
      <div class="board-card glass-panel" style="position: relative;">
        <!-- Animated Board Poke Container -->
        <div id="boardPokeOverlay" class="board-poke-overlay"></div>

        <div id="ludoBoard" class="ludo-board realistic-wood-frame">
          <!-- Grid cells (15x15) and tokens injected by JavaScript -->
        </div>
      </div>

      <!-- DICE & TURN CONTROLS -->
      <div class="controls-card glass-panel">
        <div id="turnBanner" class="turn-banner color-red">
          <span id="turnText">Waiting for game host to start...</span>
        </div>

        <div class="dice-action-area">
          <!-- 3D Realistic Dice Object (Tap to Roll) -->
          <div class="dice-wrapper">
            <div id="diceCube" class="dice-cube clickable-dice" title="Tap Dice to Roll">
              <div class="dice-face face-1"><span></span></div>
              <div class="dice-face face-2"><span></span><span></span></div>
              <div class="dice-face face-3"><span></span><span></span><span></span></div>
              <div class="dice-face face-4"><span></span><span></span><span></span><span></span></div>
              <div class="dice-face face-5"><span></span><span></span><span></span><span></span><span></span></div>
              <div class="dice-face face-6"><span></span><span></span><span></span><span></span><span></span><span></span></div>
            </div>
            <span class="dice-hint" id="diceHintText">Tap Dice to Roll</span>
          </div>

          <div class="dice-controls-right">
            <div class="dice-result-badge" id="diceResultText">
              Roll Result: <strong id="diceValueDisplay">-</strong>
            </div>
          </div>
        </div>
      </div>

    </section>

    <!-- RIGHT COLUMN: PLAYERS, LOBBY & WEBHOOK LOGS -->
    <aside class="sidebar-column">

      <!-- PLAYER SLOTS & HOME BASE COLOR PICKER -->
      <div class="panel-card glass-panel">
        <div class="panel-header">
          <h3>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Players (<span id="playerCount">1</span>/4)</span>
          </h3>
          <button id="startGameBtn" class="btn btn-success hidden">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>
            </svg>
            <span>Start Game</span>
          </button>
        </div>
        
        <div id="playersList" class="players-list">
          <!-- Player Cards, Avatar badges, Host controls & Pokes injected by JS -->
        </div>
      </div>

      <!-- LIVE CHAT PANEL -->
      <div class="panel-card glass-panel chat-panel">
        <div class="panel-header">
          <h3>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Live Chat & Reactions</span>
            <span id="chatBadge" class="unread-badge hidden">0</span>
          </h3>
        </div>

        <div id="chatMessages" class="chat-messages"></div>
        
        <!-- Quick Taunts with SVG Icons -->
        <div class="quick-taunts-bar">
          <button type="button" class="taunt-btn" data-msg="Good Luck! ⭐">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>Good Luck!</span>
          </button>
          <button type="button" class="taunt-btn" data-msg="Hurry Up! ⏰">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Hurry Up!</span>
          </button>
          <button type="button" class="taunt-btn" data-msg="Oops! 😅">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Oops!</span>
          </button>
          <button type="button" class="taunt-btn" data-msg="Nice Move! 🔥">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3.5z"/></svg>
            <span>Nice Move!</span>
          </button>
          <button type="button" class="taunt-btn" data-msg="GG WP 🏆">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
            <span>GG WP</span>
          </button>
        </div>

        <!-- FUNNY MEME VOICE PACK SHORTCUTS (WITH SVG ICONS & RESPONSIVE GRID) -->
        <div class="voice-pack-header">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          <span>Voice Pack Reactions</span>
        </div>

        <div class="voice-grid-container">
          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_Awaz nichy.mp3" data-title="Awaaz Nichy!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            <span>Awaaz Nichy!</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_Ai Baigan.mp3" data-title="Aaye Baigan!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <span>Aaye Baigan!</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_Are kehna kya chahte ho.mp3" data-title="Kehna Kya Chahte Ho?">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Kehna Kya Chahte Ho?</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_Golmaal he bhai sab golmaal hai.mp3" data-title="Golmaal Hai!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span>Golmaal Hai!</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_He Prabhu.mp3" data-title="Hey Prabhu!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span>Hey Prabhu!</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_Paisa hi paisa.mp3" data-title="Paisa Hi Paisa!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span>Paisa Hi Paisa!</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_Rahul Gandhi aloo sona machine.mp3" data-title="Aloo Sona Machine!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span>Aloo Sona Machine!</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_So Beatiful.mp3" data-title="So Beautiful!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>So Beautiful!</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_ Uthale re deva uthale re baba.mp3" data-title="Uthale Re Deva!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span>Uthale Re Deva!</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_Wah sab ji wah.mp3" data-title="Wah Sahab Ji!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
            <span>Wah Sahab Ji!</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_WO BULATI HAI MAGAR _ Ft. MODIJI.mp3" data-title="Wo Bulati Hai Magar...">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span>Wo Bulati Hai Magar...</span>
          </button>

          <button type="button" class="voice-btn" data-voice="assets/audio/Voicy_Ye baburao ka style hai.mp3" data-title="Ye Baburao Ka Style!">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5z"/></svg>
            <span>Ye Baburao Ka Style!</span>
          </button>
        </div>

        <form id="chatForm" class="chat-form">
          <input type="text" id="chatInput" placeholder="Type a live chat message..." maxlength="150" autocomplete="off">
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>

    </aside>

  </main>

  <!-- LOBBY OVERLAY MODAL (Join / Create Room, AI Human Avatars & Single-Line Color Circles) -->
  <div id="lobbyModal" class="modal-backdrop">
    <div class="modal-box glass-panel modal-lg">
      <div class="modal-hero">
        <div class="hero-icon-container">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="4" fill="rgba(6,182,212,0.15)" stroke="#06b6d4"/>
            <circle cx="8.5" cy="8.5" r="2" fill="#ef4444"/>
            <circle cx="15.5" cy="8.5" r="2" fill="#10b981"/>
            <circle cx="15.5" cy="15.5" r="2" fill="#f59e0b"/>
            <circle cx="8.5" cy="15.5" r="2" fill="#3b82f6"/>
          </svg>
        </div>
        <h2 class="funky-comic-logo">LUDO 6IX</h2>
      </div>

      <div class="lobby-tabs">
        <button id="tabCreateRoom" class="lobby-tab-btn active">Create Room</button>
        <button id="tabJoinRoom" class="lobby-tab-btn">Join Room</button>
      </div>

      <!-- Create Room Form -->
      <form id="createRoomForm" class="lobby-form active">
        <div class="form-group">
          <label for="createPlayerName">Your Nickname</label>
          <input type="text" id="createPlayerName" placeholder="e.g. MasterLudo" required maxlength="15">
        </div>

        <div class="form-group">
          <label>Choose Your Avatar:</label>
          <div class="avatar-picker-grid" id="createAvatarGrid">
            <label class="avatar-chip active"><input type="radio" name="createAvatar" value="assets/avatars/avatar1.png" checked><img src="assets/avatars/avatar1.png" alt="Avatar 1"></label>
            <label class="avatar-chip"><input type="radio" name="createAvatar" value="assets/avatars/avatar2.png"><img src="assets/avatars/avatar2.png" alt="Avatar 2"></label>
            <label class="avatar-chip"><input type="radio" name="createAvatar" value="assets/avatars/avatar3.png"><img src="assets/avatars/avatar3.png" alt="Avatar 3"></label>
            <label class="avatar-chip"><input type="radio" name="createAvatar" value="assets/avatars/avatar4.png"><img src="assets/avatars/avatar4.png" alt="Avatar 4"></label>
            <label class="avatar-chip"><input type="radio" name="createAvatar" value="assets/avatars/avatar5.png"><img src="assets/avatars/avatar5.png" alt="Avatar 5"></label>
            <label class="avatar-chip"><input type="radio" name="createAvatar" value="assets/avatars/avatar6.png"><img src="assets/avatars/avatar6.png" alt="Avatar 6"></label>
          </div>
        </div>

        <!-- SINGLE-LINE COLOR CIRCLE PICKER -->
        <div class="form-group">
          <label>Select Home Base Color:</label>
          <div class="single-line-color-picker">
            <label class="color-circle red active" title="Top-Left (Red)"><input type="radio" name="createColor" value="red" checked></label>
            <label class="color-circle green" title="Top-Right (Green)"><input type="radio" name="createColor" value="green"></label>
            <label class="color-circle yellow" title="Bottom-Right (Yellow)"><input type="radio" name="createColor" value="yellow"></label>
            <label class="color-circle blue" title="Bottom-Left (Blue)"><input type="radio" name="createColor" value="blue"></label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg shadow-btn">
          <span>Create New Game Room</span>
        </button>
      </form>

      <!-- Join Room Form -->
      <form id="joinRoomForm" class="lobby-form">
        <div class="form-group">
          <label for="joinPlayerName">Your Nickname</label>
          <input type="text" id="joinPlayerName" placeholder="e.g. LudoPro" required maxlength="15">
        </div>
        <div class="form-group">
          <label for="joinRoomCode">Room Code</label>
          <input type="text" id="joinRoomCode" placeholder="6-digit code e.g. ABC123" required maxlength="6" style="text-transform: uppercase;">
        </div>

        <div class="form-group">
          <label>Choose Your Avatar:</label>
          <div class="avatar-picker-grid" id="joinAvatarGrid">
            <label class="avatar-chip active"><input type="radio" name="joinAvatar" value="assets/avatars/avatar2.png" checked><img src="assets/avatars/avatar2.png" alt="Avatar 2"></label>
            <label class="avatar-chip"><input type="radio" name="joinAvatar" value="assets/avatars/avatar1.png"><img src="assets/avatars/avatar1.png" alt="Avatar 1"></label>
            <label class="avatar-chip"><input type="radio" name="joinAvatar" value="assets/avatars/avatar3.png"><img src="assets/avatars/avatar3.png" alt="Avatar 3"></label>
            <label class="avatar-chip"><input type="radio" name="joinAvatar" value="assets/avatars/avatar4.png"><img src="assets/avatars/avatar4.png" alt="Avatar 4"></label>
            <label class="avatar-chip"><input type="radio" name="joinAvatar" value="assets/avatars/avatar5.png"><img src="assets/avatars/avatar5.png" alt="Avatar 5"></label>
            <label class="avatar-chip"><input type="radio" name="joinAvatar" value="assets/avatars/avatar6.png"><img src="assets/avatars/avatar6.png" alt="Avatar 6"></label>
          </div>
        </div>

        <!-- SINGLE-LINE COLOR CIRCLE PICKER -->
        <div class="form-group">
          <label>Select Home Base Color:</label>
          <div class="single-line-color-picker">
            <label class="color-circle red active" title="Top-Left (Red)"><input type="radio" name="joinColor" value="red" checked></label>
            <label class="color-circle green" title="Top-Right (Green)"><input type="radio" name="joinColor" value="green"></label>
            <label class="color-circle yellow" title="Bottom-Right (Yellow)"><input type="radio" name="joinColor" value="yellow"></label>
            <label class="color-circle blue" title="Bottom-Left (Blue)"><input type="radio" name="joinColor" value="blue"></label>
          </div>
        </div>

        <button type="submit" class="btn btn-success btn-block btn-lg shadow-btn">
          <span>Join Room Now</span>
        </button>
      </form>
    </div>
  </div>

  <!-- WEBHOOK CONFIGURATION MODAL -->
  <div id="webhookModal" class="modal-backdrop hidden">
    <div class="modal-box glass-panel">
      <div class="modal-header">
        <h3>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span>Webhook Integration Setup</span>
        </h3>
        <button id="closeWebhookBtn" class="close-btn">&times;</button>
      </div>

      <form id="webhookForm" class="modal-body">
        <div class="form-group">
          <label for="modalWebhookUrl">Target Webhook Endpoint URL</label>
          <input type="url" id="modalWebhookUrl" placeholder="https://discord.com/api/webhooks/... or http://your-api.com/webhook">
        </div>

        <div class="form-group">
          <label>Trigger Events:</label>
          <div class="checkbox-grid">
            <label class="checkbox-label"><input type="checkbox" id="evtMatchStart" checked> Match Started</label>
            <label class="checkbox-label"><input type="checkbox" id="evtDiceRoll" checked> Dice Rolled</label>
            <label class="checkbox-label"><input type="checkbox" id="evtTokenCaptured" checked> Token Captured</label>
            <label class="checkbox-label"><input type="checkbox" id="evtTokenHome" checked> Token Reached Home</label>
            <label class="checkbox-label"><input type="checkbox" id="evtMatchVictory" checked> Match Victory</label>
          </div>
        </div>

        <div class="webhook-test-bar">
          <button type="button" id="testWebhookBtn" class="btn btn-secondary">
            <span>Test Endpoint</span>
          </button>
          <span id="webhookTestBadge" class="test-result-badge hidden">Testing...</span>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelWebhookBtn" class="btn btn-dark">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Settings</button>
        </div>
      </form>
    </div>
  </div>

  <!-- VICTORY OVERLAY MODAL -->
  <div id="victoryModal" class="modal-backdrop hidden">
    <div class="modal-box glass-panel victory-box text-center">
      <div class="trophy-anim-svg">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#f59e0b" stroke-width="2">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" stroke="#f59e0b"/>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" stroke="#f59e0b"/>
          <path d="M4 22h16" stroke="#f59e0b"/>
          <path d="M10 14.66V17c0 .55-.45 1-1 1H7" stroke="#f59e0b"/>
          <path d="M14 14.66V17c0 .55.45 1 1 1h2" stroke="#f59e0b"/>
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2z" fill="rgba(245,158,11,0.2)"/>
        </svg>
      </div>
      <h2>GAME OVER!</h2>
      <p class="victory-subtitle" id="victorySubtitle">We have a winner!</p>

      <div class="rankings-list" id="rankingsList">
        <!-- Rankings populated by JS -->
      </div>

      <button id="closeVictoryBtn" class="btn btn-primary btn-lg margin-top">
        <span>Return to Lobby</span>
      </button>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION (Visible on screens <= 768px) -->
  <nav class="mobile-bottom-nav">
    <button class="mobile-nav-btn active" data-view="board">
      <span class="nav-icon-svg">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
          <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/>
        </svg>
      </span>
      <span class="nav-label">Board</span>
    </button>

    <button class="mobile-nav-btn" data-view="players">
      <span class="nav-icon-svg">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
        </svg>
      </span>
      <span class="nav-label">Players</span>
    </button>

    <button class="mobile-nav-btn" data-view="chat">
      <span class="nav-icon-svg">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </span>
      <span class="nav-label">Chat & Logs</span>
      <span id="mobileChatBadge" class="unread-badge hidden">0</span>
    </button>
  </nav>

  <!-- JS Modules -->
  <script src="js/ludo-engine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
